<!DOCTYPE html>
<html lang="en">

<head>

    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link type="text/css" rel="stylesheet" href="node_modules/materialize-css/dist/css/materialize.min.css"
        media="screen,projection" />


    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        App {
            position: absolute;
            top: 0px;
            bottom: 0px;
            left: 0px;
            right: 0px;
            text-align: center;
            height: 100%;
            padding-top: 10px;
            padding-left: 25px;
            padding-right: 25px;
            background-color: #282c34;
        }

        body {
            width: 400px;
            height: 600px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
        }

        App-header {

            flex-direction: column;
            align-items: center;
            font-size: calc(10px + 2vmin);
            color: white;
        }
    </style>
</head>

<body>
    <App>
        <App-header>
            <p>
                Report Islamophobic Hate Speech
            </p>
        </App-header>

        <div class="row">
            <div class="card large">
                <div class="card-content">
                    <span class='black-text'>

                        <div class="row">
                            <div class="input-field col s12">
                                <input id="name" type="text" class="validate">
                                <label for="name">Name</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="input-field col s12">
                                <input id="username" type="text" class="validate">
                                <label for="username">Username</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="input-field col s12">
                                <input id="content" type="text" class="validate">
                                <label for="content">Tweet Content</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="input-field col s12">
                                <input id="link" type="text" class="validate">
                                <label for="link">Tweet Link</label>
                            </div>
                        </div>

                    </span>
                </div>
                <div class="card-action">
                    <a class="waves-effect waves-teal btn blue-grey darken-3"><i
                            class="material-icons right">flag</i>Report</a>
                </div>
            </div>
        </div>




    </App>

    <!--JavaScript at end of body for optimized loading-->
    <script type="text/javascript" src="node_modules/materialize-css/dist/js/materialize.min.js"></script>
    <script src="./popup_script.js"> </script>
</body>

</html>
